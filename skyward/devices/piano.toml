[device]
codename = "piano"
brand = "Xiaomi"
model = "Xiaomi Pad 8 Pro"
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel's own mode, 2136 × 3200: the touch controller's grid is portrait
# even though the stock system starts in landscape and turns the panel 270°.
width = 2136
height = 3200
density = 440
diagonal = 11.2
corner_radius = 112
# The settings page offers a portrait layout on this panel.
orientation_switch = true

# The panel's touch grid is portrait (2136 x 3200) while the DRM mode the
# recovery draws on is landscape; TWRP needs swap_xy and flip_y for the same
# panel, so the axes are swapped and Y runs the other way.
[touch]
swap_xy = true
invert_y = true

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Novatek's NT36532 over SPI behind Xiaomi's touch layer,
# whose input device the touches come in on. The panel sends raw frames that
# /odm/bin/touch_report_debug turns into touches with the models and
# libraries on the odm partition. The stock recovery already loads adsp.
load = ["xiaomi_touch", "nt36532_touch"]

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The secure world keeps its state there,
# and the WLAN driver reads its MAC address through a link in the vendor
# partition's firmware folder.
# The modem partition, whose image folder the stock recovery mounts at
# /firmware. The WLAN driver reads its settings and MAC address through it.
[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor; the script hands them
# to WALT and lets idle CPUs power down.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# Host touch processing. The stock program lives in /odm/bin under the name
# touch_report_debug; it is the same launcher the TWRP tree carries as
# touch_report, and loads libtouchreport.so from /odm/lib64.
[[service]]
path = "/odm/bin/touch_report_debug"
libraries = ["/odm/lib64", "/vendor/lib64", "/system/lib64"]
user = "root"
groups = ["root", "uhid", "input"]
capabilities = ["SYS_NICE"]

# WLAN: Qualcomm's Peach on PCIe, driven by qca_cld3_peach_v2. Once fs_ready
# is written, cnss2 powers the chip up and loads its firmware from the modem
# partition; the vendor partition's /vendor/firmware/wlan/qca_cld/peach_v2
# links carry the settings and the MAC address from vendor and persist.
[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
# The driver asks for these by the names below; the stock links in the
# vendor firmware folder are hidden when the recovery binds the modem image
# over /vendor/firmware, so put the files where the loader looks.
firmware = [
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: HyperOS 4 OS4.0.6.0, whose full
# update package on Xiaomi's download server holds the recovery partition.
[stock]
version = "OS4.0.6.0.XPYCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.6.0.XPYCNXM/piano-ota_full-OS4.0.6.0.XPYCNXM-user-17.0-96dbee09b8.zip"
recovery = "19e676d7c1914688f3289df49b2e3a9e705901a300f595733634189e8508ca8f"

[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/fingerprint", "vendor/fingerprint_ori"]

[wipe]
logs = [
    "/data/vendor/log",
    "/data/vendor/olog",
    "/data/vendor/tombstones",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/wifi",
]
